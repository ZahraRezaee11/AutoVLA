name: waymo-sft-ours
description: Fast-thinking (no-CoT) SFT of Qwen2.5-VL-3B on WOD-E2E val samples (pipeline bring-up)
model:
  use_cot: false
  pretrained_model_path: Qwen/Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  lora:
    use: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760
training:
  batch_size: 1
  learning_rate: 1.0e-4
  epochs: 5
  num_workers: 4
  weight_decay: 0.01
  lr_warmup_step: 100
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 8
data:
  train:
      json_dataset_path: ./dataset/waymo_val
      sensor_data_path: null
  val:
      json_dataset_path: ./dataset/waymo_val_rated
      sensor_data_path: null
inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
